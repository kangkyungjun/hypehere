# Contactotalk Docker Compose - Development Environment
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: contactotalk-postgres
    environment:
      POSTGRES_DB: contactotalk
      POSTGRES_USER: contactotalk
      POSTGRES_PASSWORD: contactotalk_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contactotalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: contactotalk-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contactotalk-backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --config deploy/gunicorn.conf.py contactotalk.wsgi:application
      "
    environment:
      DJANGO_ENV: production
      SECRET_KEY: dev-secret-key-change-in-production
      DB_NAME: contactotalk
      DB_USER: contactotalk
      DB_PASSWORD: contactotalk_dev
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./mediafiles:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Daphne WebSocket Server
  daphne:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contactotalk-daphne
    command: daphne -b 0.0.0.0 -p 8001 contactotalk.asgi:application
    environment:
      DJANGO_ENV: production
      SECRET_KEY: dev-secret-key-change-in-production
      DB_NAME: contactotalk
      DB_USER: contactotalk
      DB_PASSWORD: contactotalk_dev
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: contactotalk-celery
    command: celery -A contactotalk worker -l info
    environment:
      DJANGO_ENV: production
      SECRET_KEY: dev-secret-key-change-in-production
      DB_NAME: contactotalk
      DB_USER: contactotalk
      DB_PASSWORD: contactotalk_dev
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  frontend:
    build:
      context: ../contactotalk-frontend
      dockerfile: Dockerfile.frontend
    container_name: contactotalk-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8001/ws
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Nginx (Optional - for local testing with SSL)
  # nginx:
  #   image: nginx:alpine
  #   container_name: contactotalk-nginx
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
  #     - ./staticfiles:/usr/share/nginx/html/static
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  postgres_data:
  redis_data:
