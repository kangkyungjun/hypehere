# Contactotalk Docker Compose - Production/ECS Environment
# Use this with external RDS, ElastiCache, and load balancer
version: '3.8'

services:
  # Django Backend API
  backend:
    image: ${ECR_REGISTRY}/contactotalk-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: gunicorn --config deploy/gunicorn.conf.py contactotalk.wsgi:application
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}  # RDS endpoint
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: ${REDIS_URL}  # ElastiCache endpoint
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_REGION:-ap-northeast-2}
    ports:
      - "8000:8000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/contactotalk-backend
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-stream-prefix: backend

  # Daphne WebSocket Server
  daphne:
    image: ${ECR_REGISTRY}/contactotalk-backend:${IMAGE_TAG:-latest}
    command: daphne -b 0.0.0.0 -p 8001 contactotalk.asgi:application
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8001:8001"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/contactotalk-daphne
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-stream-prefix: daphne

  # Celery Worker
  celery:
    image: ${ECR_REGISTRY}/contactotalk-backend:${IMAGE_TAG:-latest}
    command: celery -A contactotalk worker -l info --concurrency=4
    environment:
      DJANGO_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: ${REDIS_URL}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/contactotalk-celery
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-stream-prefix: celery

  # Next.js Frontend
  frontend:
    image: ${ECR_REGISTRY}/contactotalk-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../contactotalk-frontend
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/contactotalk-frontend
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-stream-prefix: frontend

# Networks for ECS
networks:
  default:
    driver: bridge

# Note: In ECS, external services should be used:
# - RDS Aurora PostgreSQL for database
# - ElastiCache Redis for caching
# - S3 for static/media files
# - CloudFront for CDN
# - Application Load Balancer for routing
